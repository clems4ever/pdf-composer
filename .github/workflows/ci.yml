name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pdf-composer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (read-only, unprivileged)
        run: |
          docker run -d --name app --read-only --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 pdf-composer:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data 'x' http://127.0.0.1:8000/)" = 405
          # the container must not have written anything
          test -z "$(docker diff app)"
