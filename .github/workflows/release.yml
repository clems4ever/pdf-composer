name: Release

# Run from the Actions tab: picks the next version, publishes the Docker image
# to GHCR, then tags the commit and creates the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest v* tag
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead (e.g. 1.4.0), optional
        type: string
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$EXACT" ]; then
            v="${EXACT#v}"
          else
            last="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            IFS=. read -r major minor patch <<< "${last#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "$BUMP" in
              major) v="$((major + 1)).0.0" ;;
              minor) v="$major.$((minor + 1)).0" ;;
              *)     v="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$v' is not a valid version (expected X.Y.Z)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          {
            echo '## Docker image'
            echo
            echo '```sh'
            echo "docker run --rm --read-only --cap-drop ALL -p 8000:8000 ${IMAGE,,}:$VERSION"
            echo '```'
          } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --generate-notes
